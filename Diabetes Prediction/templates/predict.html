<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <!-- ✅ Correct way for FastAPI Jinja2 -->
    <link rel="stylesheet" href="{{ request.url_for('static', path='predict.css') }}">
</head>
<body>
    <div class="result-container">
        <h1>Prediction Result</h1>

        {% if prediction == 1 %}
            <p class="positive">The model predicts: <strong>Diabetic</strong></p>
        {% else %}
            <p class="negative">The model predicts: <strong>Not Diabetic</strong></p>
        {% endif %}

        <a href="{{ request.url_for('home') }}" class="back-btn">Go Back</a>
    </div>
</body>
</html>
