<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diabetes Prediction</title>
    <!-- ✅ Correct way for FastAPI Jinja2 -->
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Diabetes Prediction App</h1>
        <form action="{{ request.url_for('predict') }}" method="post">
            <label>Pregnancies:</label>
            <input type="number" name="pregnancies" required>

            <label>Glucose:</label>
            <input type="number" name="glucose" required>

            <label>Blood Pressure:</label>
            <input type="number" name="blood_pressure" required>

            <label>Skin Thickness:</label>
            <input type="number" name="skin_thickness" required>

            <label>Insulin:</label>
            <input type="number" name="insulin" required>

            <label>BMI:</label>
            <input type="number" step="0.1" name="bmi" required>

            <label>Diabetes Pedigree Function:</label>
            <input type="number" step="0.01" name="dpf" required>

            <label>Age:</label>
            <input type="number" name="age" required>

            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
